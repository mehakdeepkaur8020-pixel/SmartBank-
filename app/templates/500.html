{% extends "base.html" %}

{% block title %}System Error — SmartBank{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="py-5">
    <div class="display-1 fw-bold text-danger mb-3">500</div>
    <h3 class="fw-bold">Internal Banking Server Error</h3>
    <p class="text-muted">A temporary server error occurred. Financial transactions remain protected and atomic.</p>
    {% if error %}
      <div class="alert alert-danger d-inline-block small mt-2 font-monospace">{{ error }}</div>
    {% endif %}
    <div>
      <a href="/" class="btn btn-outline-primary mt-3"><i class="bi bi-house-door me-1"></i> Return to Homepage</a>
    </div>
  </div>
</div>
{% endblock %}
